name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Test share URL cleaning
        run: node --test tests/subscription-share-regression.test.js
      - name: Build extension
        run: zip -r youtube-share-url-cleaner.zip . -x '*.git*' '*node_modules*' 'youtube-share-url-cleaner.zip' '*.DS_Store'

  ci-gate:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every build and test job to succeed
        env:
          RESULT_0: ${{ needs.build.result }}
        run: |
          test "$RESULT_0" = success
