name: Deploy Firefox Add-on

on:
  push:
    branches: [main]
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Sign and submit to AMO (listed)
        env:
          AMO_API_KEY: ${{ secrets.JWT_ISSUER }}
          AMO_API_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          npx --yes web-ext@9.4.0 sign \
            --source-dir . \
            --artifacts-dir web-ext-artifacts \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --channel listed \
            --amo-metadata amo-metadata.json \
            --approval-timeout 0 \
            --timeout 900000

      - name: Upload signed XPI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-xpi
          path: web-ext-artifacts/*.xpi
          if-no-files-found: warn
          retention-days: 7
